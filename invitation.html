
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOVIRA | دعوة زواج عايش علي</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5eee5;
  color: #663d36;
  font-family: Tahoma, Arial, sans-serif;
}

.lovira {
  max-width: 480px;
  margin: auto;
  overflow: hidden;
  background: #fff7ee;
}

.panel {
  position: relative;
  width: 100%;
  overflow: hidden;
}

.panel > img {
  display: block;
  width: 100%;
  height: auto;
}

#loviraEnvelope {
  width: 100%;
  display: block;
  cursor: pointer;
}

#invitationContent {
  display: none;
}

.letter {
  min-height: 540px;
  padding: 90px 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: radial-gradient(
    circle at 50% 20%,
    #fff9f0,
    #f3d6c9 70%,
    #c99587
  );
  border: 12px solid #f5e5d9;
}

.letter .ornament {
  font-size: 38px;
  color: #a86658;
  margin: 15px;
}

.letter h1 {
  font-size: clamp(24px, 6vw, 34px);
  line-height: 1.9;
  font-weight: 500;
  color: #873e35;
}

.letter h2 {
  font-size: clamp(48px, 13vw, 76px);
  color: #84382f;
  margin: 15px;
}

.letter p {
  font-size: clamp(19px, 5vw, 25px);
  line-height: 2;
}

.countdown {
  background: linear-gradient(
    160deg,
    #f9e8dc,
    #f6d2c3,
    #fff2e7
  );
  padding: 65px 15px 80px;
  text-align: center;
  min-height: 360px;
}

.countdown h2 {
  font-size: clamp(23px, 6vw, 31px);
  margin: 0 0 35px;
  color: #853e34;
}

.timer {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  direction: rtl;
}

.timebox {
  border: 2px solid #dba99a;
  border-radius: 15px;
  background: #fff8f0a6;
  padding: 18px 3px 12px;
  min-width: 0;
}

.timebox strong {
  display: block;
  font-size: clamp(21px, 6vw, 35px);
  color: #813f35;
  font-variant-numeric: tabular-nums;
}

.timebox span {
  display: block;
  margin-top: 12px;
  font-size: clamp(13px, 3.5vw, 17px);
}

.qr-panel {
  position: relative;
  background: #f6e5d9;
}

.qr-panel > img {
  width: 100%;
  display: block;
}

#loviraRealQr {
  position: absolute;
  top: 31%;
  left: 50%;
  transform: translateX(-50%);
  width: 52%;
  aspect-ratio: 1;
  display: none;
  align-items: center;
  justify-content: center;
  background: #fff;
  z-index: 2;
  padding: 3px;
}

#loviraRealQr img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

#loviraQrMessage {
  text-align: center;
  padding: 10px 12px;
  margin: 0;
  color: #813f35;
}

.guest-info {
  text-align: center;
  background: #fff8f0;
  padding: 22px 12px;
  color: #63403c;
}

.guest-info h2 {
  margin: 0 0 10px;
  font-size: 23px;
}

.guest-info p {
  margin: 0;
  font-size: 18px;
}

.panel-fallback {
  background: #f8e9dc;
  padding: 60px 20px;
  text-align: center;
}

@media (prefers-reduced-motion: no-preference) {
  #invitationContent {
    animation: fadeIn .8s ease both;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
}
</style>
</head>

<body>

<main class="lovira">

  <!-- 1. الظرف -->
  <img
    id="loviraEnvelope"
    src="02_envelope.jpg"
    alt="اضغطي لفتح ظرف الدعوة"
    role="button"
    tabindex="0"
    aria-label="فتح دعوة زواج عايش علي"
  >

  <div id="invitationContent">

    <!-- 2. رسالة الدعوة -->
    <section class="letter">
      <div class="ornament">❀ ♡ ❀</div>

      <h1>
        إلى كل من نال في قلبي مكانًا عزيزًا
        <br>
        أدعوكم لحضور حفل زفاف ابني
      </h1>

      <div class="ornament">♡</div>
    </section>

    <!-- 3. صفحة عايش -->
    <section class="letter" style="min-height:460px">
      <div class="ornament">❀</div>

      <h2>عايش</h2>

      <p>وذلك بمشيئة الله تعالى</p>

      <div class="ornament">♡</div>
    </section>

    <!-- 4. العد التنازلي -->
    <section class="countdown">

      <h2>العد التنازلي لحفل الزفاف</h2>

      <div class="timer" id="loviraTimer">

        <div class="timebox">
          <strong id="loviraDays">00</strong>
          <span>يوم</span>
        </div>

        <div class="timebox">
          <strong id="loviraHours">00</strong>
          <span>ساعة</span>
        </div>

        <div class="timebox">
          <strong id="loviraMinutes">00</strong>
          <span>دقيقة</span>
        </div>

        <div class="timebox">
          <strong id="loviraSeconds">00</strong>
          <span>ثانية</span>
        </div>

      </div>
    </section>

    <!-- 5. تفاصيل الحفل -->
    <section class="panel">
      <img
        src="05_event_details.jpg"
        alt="تاريخ ومكان الحفل"
      >
    </section>

    <!-- 6. باركود الدخول -->
    <section class="qr-panel">

      <img
        src="06_qr_frame.png"
        alt="إطار باركود الدخول"
      >

      <div id="loviraRealQr"></div>

      <p id="loviraQrMessage"></p>

    </section>

    <!-- 7. بيانات الضيفة -->
    <section class="panel">
      <img
        src="07_guest.jpg"
        alt="تصميم بيانات الضيفة"
      >
    </section>

    <section
      id="loviraGuestInfo"
      class="guest-info"
      hidden
    >
      <h2 id="loviraGuestName"></h2>
      <p id="loviraGuestCompanions"></p>
    </section>

    <!-- 8. تأكيد الحضور -->
    <section class="panel">
      <img
        src="08_rsvp.jpg"
        alt="تعليمات تأكيد الحضور"
      >
    </section>

    <!-- 9. صفحة الختام -->
    <section class="panel">
      <img
        src="09_closing.jpg"
        alt="ختام الدعوة"
      >
    </section>

  </div>
</main>

<script>
// فتح الظرف
function openLoviraEnvelope() {
  document.getElementById("loviraEnvelope").style.display = "none";
  document.getElementById("invitationContent").style.display = "block";
}

const envelope = document.getElementById("loviraEnvelope");

envelope.addEventListener("click", openLoviraEnvelope);

envelope.addEventListener("keydown", function(e) {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    openLoviraEnvelope();
  }
});

// العد التنازلي
function updateLoviraCountdown() {
  const weddingDate = new Date("2026-11-27T19:00:00+03:00");
  const difference = Math.max(0, weddingDate - new Date());

  const days = Math.floor(difference / 86400000);
  const hours = Math.floor(difference / 3600000) % 24;
  const minutes = Math.floor(difference / 60000) % 60;
  const seconds = Math.floor(difference / 1000) % 60;

  document.getElementById("loviraDays").textContent =
    String(days).padStart(2, "0");

  document.getElementById("loviraHours").textContent =
    String(hours).padStart(2, "0");

  document.getElementById("loviraMinutes").textContent =
    String(minutes).padStart(2, "0");

  document.getElementById("loviraSeconds").textContent =
    String(seconds).padStart(2, "0");
}

updateLoviraCountdown();
setInterval(updateLoviraCountdown, 1000);

// بيانات الضيفة
const loviraGuestToken =
  new URLSearchParams(location.search).get("guest");

const loviraSupabaseUrl =
  "https://ddfdkarrcijcubzoqxce.supabase.co";

const loviraPublishableKey =
  "sb_publishable_G4b-jueJb1pAE2Kawm-R1Q_Hn7KEfAx";

async function loadLoviraGuest() {

  if (!loviraGuestToken) {
    document.getElementById("loviraQrMessage").textContent =
      "افتحي رابط الدعوة الخاص بالضيفة لإظهار باركود الدخول.";
    return;
  }

  try {
    const response = await fetch(
      `${loviraSupabaseUrl}/rest/v1/rpc/lovira_get_guest`,
      {
        method: "POST",
        headers: {
          "apikey": loviraPublishableKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_token: loviraGuestToken
        })
      }
    );

    if (!response.ok) {
      throw new Error("تعذر جلب بيانات الضيفة");
    }

    const guests = await response.json();

    if (!Array.isArray(guests) || !guests.length) {
      document.getElementById("loviraQrMessage").textContent =
        "رابط الضيفة غير صالح.";
      return;
    }

    const guest = guests[0];

    document.getElementById("loviraGuestName").textContent =
      "الضيفة: " + guest.guest_name;

    document.getElementById("loviraGuestCompanions").textContent =
      "عدد المرافقات: " + guest.companions;

    document.getElementById("loviraGuestInfo").hidden = false;

    // إنشاء الباركود الخاص بالضيفة
    if (guest.qr_token) {

      const qrData = new URL(
        "reception.html",
        location.href
      );

      qrData.searchParams.set(
        "token",
        guest.qr_token
      );

      const qrImage = document.createElement("img");

      qrImage.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
        encodeURIComponent(qrData.href);

      qrImage.alt = "باركود دخول الضيفة";

      const qrBox = document.getElementById("loviraRealQr");

      qrBox.replaceChildren(qrImage);
      qrBox.style.display = "flex";

      document.getElementById("loviraQrMessage").textContent =
        "باركود الدخول الخاص بكِ";
    }

  } catch (error) {
    console.error("LOVIRA:", error);

    document.getElementById("loviraQrMessage").textContent =
      "تعذر تحميل باركود الدخول. يرجى إعادة المحاولة.";
  }
}

loadLoviraGuest();
</script>

</body>
</html>
