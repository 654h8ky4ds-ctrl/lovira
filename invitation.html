
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOVIRA | دعوتكم الخاصة</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, Tahoma, serif;
  background: #f5eee5;
  color: #513b36;
}

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background:
    radial-gradient(circle at top, #fffaf3, transparent 65%),
    #eee1d2;
}

.envelope {
  width: min(100%, 390px);
  min-height: 570px;
  background: linear-gradient(145deg, #765044, #38241f);
  border: 2px solid #cba66c;
  border-radius: 22px;
  box-shadow: 0 20px 60px #38241f55;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity .7s, transform .7s;
}

.envelope::before {
  content: "";
  position: absolute;
  inset: 15px;
  border: 1px solid #cba66c77;
  border-radius: 15px;
  pointer-events: none;
}

.envelope h1 {
  color: #e7c894;
  letter-spacing: 4px;
  font-size: 30px;
}

.seal {
  width: 115px;
  height: 115px;
  border-radius: 45%;
  border: 5px double #a97930;
  background: radial-gradient(circle, #ffe5a2, #c58b37 70%);
  box-shadow: 0 8px 22px #0007;
  color: #795020;
  font-size: 49px;
  cursor: pointer;
  margin: 45px 0 25px;
  transition: transform .3s;
}

.seal:active { transform: scale(.93); }

.hint { color: #f1ddc1; }

.invitation {
  display: none;
  width: min(100%, 430px);
  min-height: 650px;
  padding: 55px 25px;
  border: 2px solid #c9a66c;
  border-radius: 20px;
  background: #fffaf2;
  text-align: center;
  box-shadow: 0 15px 45px #5b3c3022;
  animation: reveal 1s ease both;
}

.invitation h1 {
  color: #a4773b;
  font-size: 30px;
}

.names {
  font-size: 35px;
  color: #63403c;
  margin: 35px 0;
  line-height: 1.8;
}

.divider {
  width: 90px;
  height: 1px;
  background: #c9a66c;
  margin: 25px auto;
}

.details { line-height: 2.5; }

@keyframes reveal {
  from { opacity: 0; transform: translateY(35px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>


<style>
.lovira-new-design {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.lovira-new-design img {
  display: none;
  width: 100%;
  height: auto;
}

#loviraEnvelope {
  display: block;
}
</style>
  <div class="lovira-new-design">
    
<img
  src="02_envelope.jpg"
  alt="اضغطي لفتح الظرف"
  id="loviraEnvelope"
  onclick="openLoviraEnvelope()"
  style="cursor:pointer;"
>

<img
  src="03_music.jpg"
  alt="بطاقة الدعوة والموسيقى"
  id="loviraOpened"
  style="display:none;"
>
<div id="loviraCountdown" style="position:relative;width:100%;display:none;">
  <img src="04_countdown_new.png.PNG" alt="العد التنازلي" style="width:100%;display:block;">

  <div id="loviraTimer"
     style="position:absolute;top:16%;;left:0;width:100%;display:flex;justify-content:space-evenly;align-items:center;direction:rtl;color:#813f35;font-size:clamp(16px,5vw,32px);font-weight:bold;">
  <span id="loviraDays">00</span>
  <span id="loviraHours">00</span>
  <span id="loviraMinutes">00</span>
  <span id="loviraSeconds">00</span>
</div>
</div>
<img src="05_event_details.jpg" alt="تفاصيل الحفل">
<style>
#loviraQrSection {
  text-align: center;
}

#loviraRealQr {
  display: none;
  background: #fff;
  padding: 16px;
  margin: 15px auto;
  width: fit-content;
  border-radius: 12px;
}
</style>

<div id="loviraQrSection" style="position:relative;width:100%;max-width:480px;margin:auto;">

<img src="06_qr_frame.png" alt="تصميم باركود الدعوة">
<div id="loviraRealQr"

style="display:none;position:absolute;top:31%;left:50%;transform:translateX(-50%);width:52%;aspect-ratio:1;background:white;padding:0;margin:0;border-radius:0;z-index:2;"

</div>
<p id="loviraQrMessage"
  style="text-align:center;color:#813f35;">
</p>

</div>
<img src="07_guest.jpg" alt="بيانات الضيفة">
    
<div id="loviraGuestInfo" style="display:none;text-align:center;background:#fffaf2;padding:20px;color:#63403c;">
  <h2 id="loviraGuestName"></h2>
  <p id="loviraGuestCompanions"></p>
</div>

<img src="08_rsvp.jpg" alt="تأكيد الحضور">
<img src="09_closing.jpg" alt="ختام الدعوة">
  </div>
<script>
function openLoviraEnvelope() {
  document.getElementById("loviraEnvelope").style.display = "none";
  document.getElementById("loviraOpened").style.display = "block";
document.querySelectorAll('.lovira-new-design > img:not(#loviraEnvelope)').forEach(img => {
  img.style.display = 'block';
});
document.getElementById("loviraCountdown").style.display = "block";
}

</script>
  <script>
function updateLoviraCountdown() {
  const weddingDate = new Date("2026-11-27T19:00:00+03:00");
  const now = new Date();
  const difference = weddingDate - now;
  const timer = document.getElementById("loviraTimer");

  if (!timer) return;

  if (difference <= 0) {
    timer.textContent = "حان موعد حفل الزفاف 💗";
    return;
  }

  const days = Math.floor(difference / 86400000);
  const hours = Math.floor((difference / 3600000) % 24);
  const minutes = Math.floor((difference / 60000) % 60);
  const seconds = Math.floor((difference / 1000) % 60);

  document.getElementById("loviraDays").textContent =
  String(days).padStart(2, "0");

document.getElementById("loviraHours").textContent =
  String(hours).padStart(2, "0");

document.getElementById("loviraMinutes").textContent =
  String(minutes).padStart(2, "0");

document.getElementById("loviraSeconds").textContent =
  String(seconds).padStart(2, "0");
}

updateLoviraCountdown();
setInterval(updateLoviraCountdown, 1000);
</script>
<script>
const loviraGuestToken = new URLSearchParams(window.location.search).get("guest");

const loviraSupabaseUrl = "https://ddfdkarrcijcubzoqxce.supabase.co";
const loviraPublishableKey = "sb_publishable_G4b-jueJb1pAE2Kawm-R1Q_Hn7KEfAx";

async function loadLoviraGuest() {
  if (!loviraGuestToken) return;

  try {
    const response = await fetch(
      `${loviraSupabaseUrl}/rest/v1/rpc/lovira_get_guest`,
      {
        method: "POST",
        headers: {
          "apikey": loviraPublishableKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_token: loviraGuestToken
        })
      }
    );

    if (!response.ok) throw new Error("تعذر جلب الضيفة");

    const guests = await response.json();
    if (!guests.length) {
      console.log("رابط الضيفة غير صالح");
      return;
    }


const guest = guests[0];

document.getElementById("loviraGuestName").textContent =
  "الضيفة: " + guest.guest_name;

document.getElementById("loviraGuestCompanions").textContent =
  "عدد المرافقات: " + guest.companions;

document.getElementById("loviraGuestInfo").style.display = "block";

const qrBox = document.getElementById("loviraRealQr");
const qrMessage = document.getElementById("loviraQrMessage");

if (guest.qr_token) {
  const qrImage = document.createElement("img");

  const qrData = new URL("reception.html", location.href);
  qrData.searchParams.set("token", guest.qr_token);

  qrImage.src =
    "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
    encodeURIComponent(qrData.href);

  qrImage.alt = "باركود دخول الضيفة";
  qrImage.style.cssText = "width:220px;max-width:100%;display:block;";

  qrBox.replaceChildren(qrImage);
  qrBox.style.display = "block";

  qrMessage.textContent = "باركود الدخول الخاص بكِ";
}

  } catch (error) {
    console.error("LOVIRA:", error);
  }
}

loadLoviraGuest();

</script>
</body>
</html>
