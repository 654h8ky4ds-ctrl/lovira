
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOVIRA | دعوة زواج عايش علي</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f5eee5;
  color: #813f35;
  font-family: Tahoma, Arial, sans-serif;
}

.lovira {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
}

.panel {
  position: relative;
  width: 100%;
  line-height: 0;
}

.panel > img {
  display: block;
  width: 100%;
  height: auto;
}

#loviraEnvelope {
  display: block;
  width: 100%;
  cursor: pointer;
}

#invitationContent {
  display: none;
}


#loviraTimer {
  position: absolute;
top: 37%;
  left: 11.5%;
  width: 77%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3%;
  direction: ltr;
  text-align: center;
  align-items: center;
}


#loviraTimer span {
  display: block;
  color: #813f35;
font-size: clamp(24px, 7vw, 36px);
  font-weight: bold;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

#loviraRealQr {
  position: absolute;
  top: 42%;
  left: 50%;
  transform: translateX(-50%);
  width: 33%;
  aspect-ratio: 1;
  display: none;
  background: white;
  padding: 0px;
  align-items: center;
  justify-content: center;
}

#loviraRealQr img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#loviraQrMessage {
  position: absolute;
  bottom: 9%;
  width: 100%;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  color: #813f35;
}

#loviraGuestName {
  position: absolute;
  top: 27%;
  left: 12%;
  width: 76%;
  text-align: center;
  font-size: clamp(15px, 4.5vw, 23px);
  font-weight: bold;
  line-height: 1.4;
}

#loviraGuestCompanions {
  position: absolute;
  top: 44%;
  left: 12%;
  width: 76%;
  text-align: center;
  font-size: clamp(16px, 4.5vw, 23px);
  font-weight: bold;
  line-height: 1.4;
}

.guest-display {
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  #invitationContent {
    animation: fadeIn .7s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
}
 
.lovira,
#invitationContent,
.panel {
  margin: 0 !important;
  padding: 0 !important;
}

.panel {
  display: block;
  line-height: 0;
}

.panel > img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 !important;
}

#loviraQrMessage:empty {
  display: none;
}
 

#loviraGuestName {
  top: 35% !important;
  transform: translateY(-50%);
}

#loviraGuestCompanions {
  top: 56% !important;
  transform: translateY(-50%);
}

@keyframes loviraSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.lovira-spinning {
  animation: loviraSpin 3s linear infinite;
  transform-origin: center center;
}
</style>
</head>

<body>

<main class="lovira">

  <!-- 1: الظرف -->
  <img
    id="loviraEnvelope"
    src="1.jpg"
    alt="اضغطي لفتح الظرف"
    role="button"
    tabindex="0"
  >

  <div id="invitationContent">

    <!-- 2: رسالة الدعوة -->


    
<!-- 3: الأسطوانة الموسيقية -->
<section class="panel" id="loviraMusicSection">
  <img
src="music-bg.jpg"
    alt="اضغطي لتشغيل أو إيقاف الصوت"
    id="loviraMusicButton"
    onclick="toggleLoviraMusic()"
    role="button"
    tabindex="0"
    style="cursor:pointer;"
  >
<img
  id="loviraRecord"
  src="vinyl.png"
  alt=""
  aria-hidden="true"
  style="
    position:absolute;
    width:42%;
    left:48%;
    top:73%;
    z-index:3;
    pointer-events:none;
  "
>
<audio id="loviraMusic" src="wedding.mp3.mp3" preload="auto"></audio>
</section>
<section class="panel" style="position:relative;">
<img src="3.jpg" alt="دعوة زواج عايش" style="display:block;width:100%;height:auto;">
  <button
  type="button"
  onclick="toggleLoviraMusic()"
  aria-label="تشغيل أو إيقاف الشيلة"
  style="
    position:absolute;
    left:52%;
    top:79%;
    width:30%;
    height:17%;
    border:0;
    background:transparent;
    cursor:pointer;
    z-index:5;
  "
></button>
    </section>

    <!-- 4: العد التنازلي -->
    <section class="panel">
<img src="5.jpg" alt="العد التنازلي">

      <div id="loviraTimer">
        <span id="loviraSeconds">00</span>
        <span id="loviraMinutes">00</span>
        <span id="loviraHours">00</span>
        <span id="loviraDays">00</span>
      </div>
    </section>

    
<!-- 5: تفاصيل الحفل -->
<section class="panel">
  <a href="https://maps.app.goo.gl/ecntp91hcaU6pYQ88?g_st=ic"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="فتح موقع الحفل في خرائط Google"
     style="display:block;">
    <img src="4.jpg"
         alt="تفاصيل الحفل - اضغطي لفتح الموقع"
         style="display:block;width:100%;height:auto;">
  </a>
</section>


<!-- 7: تأكيد الحضور -->

<!-- إثبات الحضور على الصورة الأصلية -->
<section class="panel" id="loviraRsvpSection">
  <img src="6.jpg" alt="إثبات الحضور">

  <button type="button" id="loviraAttend"
    onclick="selectLoviraRsvp('attending')"
    aria-label="سأحضر"
    style="position:absolute;top:30%;right:9%;width:40%;height:22%;;;background:transparent;border:0;cursor:pointer;">
  </button>

  <button type="button" id="loviraDecline"
    onclick="selectLoviraRsvp('declined')"
    aria-label="لن أحضر"
    style="position:absolute;top:30%;left:9%;width:40%;height:22%;;;background:transparent;border:0;cursor:pointer;">
  </button>

  <button type="button" id="loviraRsvpSubmit"
    onclick="submitLoviraRsvp()"
    aria-label="إرسال التأكيد"
    style="position:absolute;top:70%;left:20%;width:60%;height:9%;background:transparent;border:0;cursor:pointer;">
  </button>

  

<p id="loviraRsvpMessage" aria-live="polite"
  style="
    position:absolute;
    top:81%;
    left:10%;
    width:80%;
    text-align:center;
    color:#000000;
    font-size:18px;
    font-weight:bold;
    line-height:1.4;
    margin:0;
    z-index:5;
  ">
</p>


</section>

</section>

    <!-- 8: بيانات الضيفة -->
    <section class="panel guest-display">
      <img src="8.jpg" alt="بيانات الضيفة">
      <div id="loviraGuestName"></div>
      <div id="loviraGuestCompanions"></div>
    </section>
<!-- باركود الدخول بعد بيانات الضيفة -->
<section class="panel">
  <img src="7.jpg" alt="باركود الدخول إلى الحفل">
  <div id="loviraRealQr"></div>
  <div id="loviraQrMessage"></div>
</section>
    <!-- 9: الختام -->
    <section class="panel">
      <img src="9.jpg" alt="شاكرين لكم تلبية الدعوة">
    </section>

  </div>
</main>

<script>
function openLoviraEnvelope() {
  document.getElementById("loviraEnvelope").style.display = "none";
  document.getElementById("invitationContent").style.display = "block";
}

const envelope = document.getElementById("loviraEnvelope");

envelope.addEventListener("click", openLoviraEnvelope);

envelope.addEventListener("keydown", function(e) {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    openLoviraEnvelope();
  }
});

// العد التنازلي
function updateLoviraCountdown() {
  const weddingDate = new Date("2026-11-27T19:00:00+03:00");
  const difference = Math.max(0, weddingDate - new Date());

  const days = Math.floor(difference / 86400000);
  const hours = Math.floor(difference / 3600000) % 24;
  const minutes = Math.floor(difference / 60000) % 60;
  const seconds = Math.floor(difference / 1000) % 60;

  document.getElementById("loviraDays").textContent =
    String(days).padStart(2, "0");

  document.getElementById("loviraHours").textContent =
    String(hours).padStart(2, "0");

  document.getElementById("loviraMinutes").textContent =
    String(minutes).padStart(2, "0");

  document.getElementById("loviraSeconds").textContent =
    String(seconds).padStart(2, "0");
}

updateLoviraCountdown();
setInterval(updateLoviraCountdown, 1000);

// بيانات الضيفة والباركود
const loviraGuestToken =
  new URLSearchParams(location.search).get("guest");

const loviraSupabaseUrl =
  "https://ddfdkarrcijcubzoqxce.supabase.co";

const loviraPublishableKey =
  "sb_publishable_G4b-jueJb1pAE2Kawm-R1Q_Hn7KEfAx";

async function loadLoviraGuest() {
  const qrMessage = document.getElementById("loviraQrMessage");

  if (!loviraGuestToken) {
qrMessage.textContent = "";
    return;
  }

  try {
    const response = await fetch(
      `${loviraSupabaseUrl}/rest/v1/rpc/lovira_get_guest`,
      {
        method: "POST",
        headers: {
          "apikey": loviraPublishableKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_token: loviraGuestToken
        })
      }
    );

    if (!response.ok) {
      throw new Error("تعذر جلب بيانات الضيفة");
    }

    const guests = await response.json();

    if (!Array.isArray(guests) || !guests.length) {
      qrMessage.textContent = "رابط الضيفة غير صالح";
      return;
    }

    const guest = guests[0];

    document.getElementById("loviraGuestName").textContent =
      guest.guest_name || "";

    document.getElementById("loviraGuestCompanions").textContent =
String(guest.companions ?? 0);

    if (guest.qr_token) {
      const qrData = new URL("reception.html", location.href);
      qrData.searchParams.set("token", guest.qr_token);

      const qrImage = document.createElement("img");

      qrImage.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
        encodeURIComponent(qrData.href);

      qrImage.alt = "باركود دخول الضيفة";

      const qrBox = document.getElementById("loviraRealQr");

      qrBox.replaceChildren(qrImage);
      qrBox.style.display = "flex";
      qrMessage.textContent = "";
    }
  } catch (error) {
    console.error("LOVIRA:", error);
    qrMessage.textContent = "تعذر تحميل بيانات الدعوة";
  }
}

loadLoviraGuest();

const loviraMusic = document.getElementById("loviraMusic");
const loviraMusicButton = document.getElementById("loviraMusicButton");

function toggleLoviraMusic() {
  if (loviraMusic.paused) {
    loviraMusic.play().catch(error => {
      console.error("تعذر تشغيل الصوت:", error);
    });
  } else {
    loviraMusic.pause();
  }
}
const loviraRecord = document.getElementById("loviraRecord");

loviraMusic.addEventListener("play", () => {
  loviraRecord?.classList.add("lovira-spinning");
});

loviraMusic.addEventListener("pause", () => {
  loviraRecord?.classList.remove("lovira-spinning");
});

loviraMusic.addEventListener("ended", () => {
  loviraRecord?.classList.remove("lovira-spinning");
});

loviraMusicButton.addEventListener("keydown", function(e) {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    toggleLoviraMusic();
  }
});

let loviraSelectedRsvp = null;


function selectLoviraRsvp(status) {
  loviraSelectedRsvp = status;

  const attend = document.getElementById("loviraAttend");
  const decline = document.getElementById("loviraDecline");

  attend.style.background = "transparent";
  decline.style.background = "transparent";
attend.style.borderRadius = "50%";
decline.style.borderRadius = "50%";

attend.style.boxShadow = "none";
decline.style.boxShadow = "none";

attend.style.outline = "none";
decline.style.outline = "none";

attend.style.filter =
  status === "attending"
    ? "drop-shadow(0 0 12px #ff6b9d)"
    : "none";

decline.style.filter =
  status === "declined"
    ? "drop-shadow(0 0 12px #ff6b9d)"
    : "none";

  document.getElementById("loviraRsvpMessage").textContent = "";
}


async function submitLoviraRsvp() {
  const message = document.getElementById("loviraRsvpMessage");
  const button = document.getElementById("loviraRsvpSubmit");

  if (!loviraSelectedRsvp) {
    message.textContent = "اختاري سأحضر أو لن أحضر أولاً";
    return;
  }

  if (!loviraGuestToken) {
    message.textContent = "افتحي رابط الدعوة الخاص بالضيفة";
    return;
  }

  button.disabled = true;
  message.textContent = "جاري حفظ التأكيد...";

  try {
    const response = await fetch(
      loviraSupabaseUrl + "/rest/v1/rpc/lovira_submit_rsvp",
      {
        method: "POST",
        headers: {
          "apikey": loviraPublishableKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_token: loviraGuestToken,
          p_status: loviraSelectedRsvp
        })
      }
    );

    if (!response.ok) {
      throw new Error("تعذر حفظ التأكيد");
    }

    const saved = await response.json();

    if (saved !== true) {
      throw new Error("رابط الضيفة غير صالح");
    }

    message.textContent =
      loviraSelectedRsvp === "attending"
        ? "تم تأكيد حضورك بنجاح 💗"
        : "تم تسجيل اعتذارك عن الحضور 💗";

  } catch (error) {
    console.error(error);
    message.textContent = "تعذر حفظ الرد، حاولي مرة أخرى";
    button.disabled = false;
  }
}

</script>

</body>
</html>
