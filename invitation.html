
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOVIRA | دعوتكم الخاصة</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, Tahoma, serif;
  background: #f5eee5;
  color: #513b36;
}

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background:
    radial-gradient(circle at top, #fffaf3, transparent 65%),
    #eee1d2;
}

.envelope {
  width: min(100%, 390px);
  min-height: 570px;
  background: linear-gradient(145deg, #765044, #38241f);
  border: 2px solid #cba66c;
  border-radius: 22px;
  box-shadow: 0 20px 60px #38241f55;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity .7s, transform .7s;
}

.envelope::before {
  content: "";
  position: absolute;
  inset: 15px;
  border: 1px solid #cba66c77;
  border-radius: 15px;
  pointer-events: none;
}

.envelope h1 {
  color: #e7c894;
  letter-spacing: 4px;
  font-size: 30px;
}

.seal {
  width: 115px;
  height: 115px;
  border-radius: 45%;
  border: 5px double #a97930;
  background: radial-gradient(circle, #ffe5a2, #c58b37 70%);
  box-shadow: 0 8px 22px #0007;
  color: #795020;
  font-size: 49px;
  cursor: pointer;
  margin: 45px 0 25px;
  transition: transform .3s;
}

.seal:active { transform: scale(.93); }

.hint { color: #f1ddc1; }

.invitation {
  display: none;
  width: min(100%, 430px);
  min-height: 650px;
  padding: 55px 25px;
  border: 2px solid #c9a66c;
  border-radius: 20px;
  background: #fffaf2;
  text-align: center;
  box-shadow: 0 15px 45px #5b3c3022;
  animation: reveal 1s ease both;
}

.invitation h1 {
  color: #a4773b;
  font-size: 30px;
}

.names {
  font-size: 35px;
  color: #63403c;
  margin: 35px 0;
  line-height: 1.8;
}

.divider {
  width: 90px;
  height: 1px;
  background: #c9a66c;
  margin: 25px auto;
}

.details { line-height: 2.5; }

@keyframes reveal {
  from { opacity: 0; transform: translateY(35px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>


<style>
.lovira-new-design {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.lovira-new-design img {
  display: none;
  width: 100%;
  height: auto;
}

#loviraEnvelope {
  display: block;
}
</style>
  <div class="lovira-new-design">
    <div id="loviraCountdown" style="text-align:center;padding:25px 10px;background:#f5e9df;color:#813d48;font-size:22px;border-radius:15px;margin:12px 0;">
  <div style="font-size:17px;margin-bottom:10px;">العد التنازلي لحفل زفاف عايش</div>
  <div id="loviraTimer">جاري حساب الوقت...</div>
</div>
<img
  src="02_envelope.jpg"
  alt="اضغطي لفتح الظرف"
  id="loviraEnvelope"
  onclick="openLoviraEnvelope()"
  style="cursor:pointer;"
>

<img
  src="03_music.jpg"
  alt="بطاقة الدعوة والموسيقى"
  id="loviraOpened"
  style="display:none;"
>
 <img src="04_countdown.jpg" alt="العد التنازلي">
<img src="05_event_details.jpg" alt="تفاصيل الحفل">
<style>
#loviraQrSection {
  text-align: center;
}

#loviraRealQr {
  display: none;
  background: #fff;
  padding: 16px;
  margin: 15px auto;
  width: fit-content;
  border-radius: 12px;
}
</style>
    <div id="loviraQrSection">
  <img src="06_qr.jpg" alt="تصميم باركود الدعوة">
  <div id="loviraRealQr"></div>
</div>
<img src="07_guest.jpg" alt="بيانات الضيفة">
<img src="08_rsvp.jpg" alt="تأكيد الحضور">
<img src="09_closing.jpg" alt="ختام الدعوة">
  </div>
<script>
function openLoviraEnvelope() {
  document.getElementById("loviraEnvelope").style.display = "none";
  document.getElementById("loviraOpened").style.display = "block";
document.querySelectorAll('.lovira-new-design img:not(#loviraEnvelope)').forEach(img => {
  img.style.display = 'block';
});
}

</script>
  <script>
function updateLoviraCountdown() {
  const weddingDate = new Date("2026-11-27T19:00:00+03:00");
  const now = new Date();
  const difference = weddingDate - now;
  const timer = document.getElementById("loviraTimer");

  if (!timer) return;

  if (difference <= 0) {
    timer.textContent = "حان موعد حفل الزفاف 💗";
    return;
  }

  const days = Math.floor(difference / 86400000);
  const hours = Math.floor((difference / 3600000) % 24);
  const minutes = Math.floor((difference / 60000) % 60);
  const seconds = Math.floor((difference / 1000) % 60);

  timer.textContent =
    `${days} يوم | ${hours} ساعة | ${minutes} دقيقة | ${seconds} ثانية`;
}

updateLoviraCountdown();
setInterval(updateLoviraCountdown, 1000);
</script>
</body>
</html>
