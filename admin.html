
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOVIRA | لوحة الإدارة</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f7f0f5;
  color: #56334f;
}
header {
  background: #56334f;
  color: white;
  padding: 25px;
  text-align: center;
}
header h1 { margin: 0 0 8px; }
main { max-width: 850px; margin: 25px auto; padding: 15px; }
.card {
  background: white;
  padding: 22px;
  margin-bottom: 20px;
  border-radius: 16px;
  box-shadow: 0 5px 20px #56334f12;
}
input, button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 9px;
  font-size: 15px;
}
input { border: 1px solid #d9c7d4; }
button {
  background: #754568;
  color: white;
  border: none;
  cursor: pointer;
}
button:disabled { opacity: .5; }
#dashboard { display: none; }
small { color: #806b7c; }
</style>
</head>
<body>

<header>
  <h1>LOVIRA ♛</h1>
  <div>لوحة إدارة الدعوات الخاصة</div>
</header>

<main>
  <section class="card" id="login">
    <h2>تسجيل دخول الإدارة</h2>
    <input id="email" type="email"
      placeholder="البريد الإلكتروني">
    <input id="password" type="password"
      placeholder="كلمة المرور">
    <button id="loginBtn">تسجيل الدخول</button>
    <p id="loginMessage"></p>
  </section>

  <section id="dashboard">
    <div class="card">
      <h2>مرحبًا بك في LOVIRA 💜</h2>
      <p>إدارة المناسبات والضيفات والدعوات.</p>
      <button id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="card">
      <h2>💌 إدارة الضيفات</h2>

<form id="loviraGuestForm">
  
<label for="loviraEventSelect">اختاري المناسبة:</label>
<select id="loviraEventSelect" required
  style="width:100%;padding:13px;margin:8px 0;border:1px solid #d9c7d4;border-radius:9px;background:white;">
  <option value="">جارٍ تحميل المناسبات...</option>
</select>

  <input id="newGuestName" type="text"
    placeholder="اسم الضيفة" required>

  <input id="newGuestCompanions" type="number"
    placeholder="عدد المرافقات"
    min="0" value="0" required>

  <button type="submit">💌 إضافة ضيفة</button>
</form>
<p id="guestMessage"></p>

<hr style="border:0;border-top:1px solid #e5d5e0;margin:25px 0;">

<h3>💜 قائمة الضيفات</h3>

<button type="button" id="loadGuestsBtn">
  عرض الضيفات
</button>

<div id="loviraGuestsList"
  style="margin-top:15px;">
</div>

    </div>

    
<div class="card">
  <h2>📱 روابط الدعوات</h2>
  <p>اختاري المناسبة من قسم إدارة الضيفات، ثم اعرضي روابط الدعوات.</p>

  <button type="button" id="loadInvitationLinksBtn">
    💌 عرض روابط الدعوات
  </button>

  <p id="invitationLinksMessage"></p>
  <div id="invitationLinksList"></div>
</div>


    
<div class="card">
  <h2>📊 متابعة الحضور</h2>
  <p>تقرير الحضور للمناسبة المختارة</p>

  <button type="button" id="loadAttendanceBtn">
    📊 عرض تقرير الحضور
  </button>

  <button type="button" id="downloadAttendanceBtn"
    style="background:#39735b;">
    📥 تحميل التقرير Excel
  </button>

  <p id="attendanceMessage"></p>

  <div id="attendanceSummary"></div>

  <div id="attendanceTable"
    style="overflow-x:auto;margin-top:15px;">
  </div>
</div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient(
  "https://ddfdkarrcijcubzoqxce.supabase.co",
  "sb_publishable_G4b-jueJb1pAE2Kawm-R1Q_Hn7KEfAx"
);

const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("loginMessage");

async function showSession() {
  const { data } = await db.auth.getUser();
  const user = data.user;

  // لا تُعرض لوحة الإدارة إلا بعد التحقق
  // من الصلاحيات في الخطوة التالية.
  login.style.display = "block";
  dashboard.style.display = "none";

  
if (user) {
  const { data: admin, error } = await db
    .from("lovira_admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (!error && admin) {
    login.style.display = "none";
    dashboard.style.display = "block";
    message.textContent = "";
  } else {
    message.textContent =
      "هذا الحساب غير مصرح له بدخول لوحة الإدارة.";
  }
}

}

document.getElementById("loginBtn").onclick =
async function () {
  message.textContent = "جارٍ التحقق...";
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({
    email, password
  });

  if (error) {
    message.textContent = "تعذر تسجيل الدخول: " + error.message;
    return;
  }

  await showSession();
};

document.getElementById("logoutBtn").onclick =
async function () {
  await db.auth.signOut();
  await showSession();
};

showSession();
  
document.getElementById("loviraGuestForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("guestMessage");
    const guestName = document.getElementById("newGuestName").value.trim();
    const companions = Number(
      document.getElementById("newGuestCompanions").value
    );

    if (!guestName || !Number.isInteger(companions) || companions < 0) {
      message.textContent = "تأكدي من اسم الضيفة وعدد المرافقات.";
      return;
    }

    message.textContent = "جارٍ إضافة الضيفة...";

    
const eventId = document.getElementById("loviraEventSelect").value;

if (!eventId) {
  message.textContent = "اختاري المناسبة أولًا.";
  return;
}


    const { error } = await db
      .from("lovira_guests")
      .insert({
event_id: eventId,
        guest_name: guestName,
        companions: companions
      });

    if (error) {
      message.textContent = "تعذرت الإضافة: " + error.message;
      return;
    }

    
message.textContent = "تمت إضافة الضيفة بنجاح 💜";

// تحديث تقرير الحضور تلقائيًا
await loadAttendanceReport();

// تحديث قائمة الضيفات
document.getElementById("loadGuestsBtn").click();

// تفريغ اسم الضيفة وعدد المرافقات فقط
document.getElementById("newGuestName").value = "";
document.getElementById("newGuestCompanions").value = "0";
  });

async function loadLoviraEvents() {
  const select = document.getElementById("loviraEventSelect");

  const { data, error } = await db
    .from("lovira_events")
    .select("id,event_name");

  select.innerHTML = "";

  if (error) {
    select.add(new Option("تعذر تحميل المناسبات", ""));
    console.error(error);
    return;
  }

  select.add(new Option("اختاري المناسبة", ""));

  for (const event of data) {
    select.add(new Option(event.event_name, event.id));
  }
}

loadLoviraEvents();

document.getElementById("loadGuestsBtn").onclick =
async function () {
  const list = document.getElementById("loviraGuestsList");
  const eventId = document.getElementById("loviraEventSelect").value;

  if (!eventId) {
    list.textContent = "اختاري المناسبة أولًا.";
    return;
  }

  list.textContent = "جارٍ تحميل الضيفات...";

  const { data, error } = await db
    .from("lovira_guests")
.select("id,guest_name,companions,qr_token")
    .eq("event_id", eventId)
    .order("guest_name");

  if (error) {
    list.textContent = "تعذر تحميل الضيفات: " + error.message;
    return;
  }

  list.replaceChildren();

  if (!data.length) {
    list.textContent = "لا توجد ضيفات لهذه المناسبة.";
    return;
  }

  for (const guest of data) {
    const card = document.createElement("div");
    card.style.cssText =
      "padding:15px;margin:10px 0;border:1px solid #e5d5e0;border-radius:12px;";

    const name = document.createElement("strong");
    name.textContent = guest.guest_name;

    const info = document.createElement("p");
    info.textContent = "المرافقات: " + guest.companions;

    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "💌 نسخ رابط الدعوة";

    button.onclick = async function () {
      const url = new URL("invitation.html", location.href);
      url.searchParams.set("guest", guest.qr_token);

      try {
        await navigator.clipboard.writeText(url.href);
        button.textContent = "تم نسخ الرابط ✓";
      } catch {
        window.prompt("انسخي رابط الدعوة:", url.href);
      }
    };


const deleteButton = document.createElement("button");
deleteButton.type = "button";
deleteButton.textContent = "🗑️ حذف الضيفة";

deleteButton.style.cssText = `
  background:#a83f55;
  color:white;
  margin-top:8px;
`;

deleteButton.onclick = async function () {
  const confirmed = confirm(
    "هل أنتِ متأكدة من حذف الضيفة: " +
    guest.guest_name +
    "؟\nسيتم حذف باركودها وباركودات مرافقاتها نهائيًا."
  );

  if (!confirmed) return;

  deleteButton.disabled = true;
  deleteButton.textContent = "جارٍ الحذف...";

  const { data: deleted, error } = await db
    .from("lovira_guests")
    .delete()
    .eq("id", guest.id)
    .eq("event_id", eventId)
    .select("id");

  if (error || !deleted || deleted.length !== 1) {
    alert(
      "تعذر حذف الضيفة. تأكدي من صلاحيات الحذف في Supabase."
    );
    deleteButton.disabled = false;
    deleteButton.textContent = "🗑️ حذف الضيفة";
    return;
  }

  
card.remove();

// تحديث تقرير الحضور بعد حذف الضيفة
await loadAttendanceReport();

alert("تم حذف الضيفة وتحديث تقرير الحضور بنجاح 💜");
};

card.append(name, info, button, deleteButton);

    list.appendChild(card);
  }
};

let loviraAttendanceRows = [];

async function loadAttendanceReport() {
  const eventId = document.getElementById("loviraEventSelect").value;
  const msg = document.getElementById("attendanceMessage");
  const summary = document.getElementById("attendanceSummary");
  const table = document.getElementById("attendanceTable");

  loviraAttendanceRows = [];
  summary.replaceChildren();
  table.replaceChildren();

  if (!eventId) {
    msg.textContent = "اختاري المناسبة أولًا.";
    return;
  }

  msg.textContent = "جارٍ تحميل تقرير الحضور...";

  const { data: guests, error: guestError } = await db
    .from("lovira_guests")
    .select("id,guest_name,companions,is_used,used_at")
    .eq("event_id", eventId)
    .order("guest_name");

  if (guestError) {
    msg.textContent = "تعذر تحميل الضيفات: " + guestError.message;
    return;
  }

  const guestIds = (guests || []).map(g => g.id);
  let companions = [];

  if (guestIds.length) {
    const { data, error } = await db
      .from("lovira_companions")
      .select("guest_id,is_used,used_at")
      .in("guest_id", guestIds);

    if (error) {
      msg.textContent = "تعذر تحميل المرافقات: " + error.message;
      return;
    }

    companions = data || [];
  }

  const companionMap = new Map();

  for (const companion of companions) {
    const stats = companionMap.get(companion.guest_id) || {
      total: 0,
      attended: 0
    };

    stats.total++;
    if (companion.is_used) stats.attended++;

    companionMap.set(companion.guest_id, stats);
  }

  loviraAttendanceRows = (guests || []).map(guest => {
    const stats = companionMap.get(guest.id) || {
      total: 0,
      attended: 0
    };

    return {
      "اسم الضيفة": guest.guest_name,
      "عدد المرافقات": stats.total,
      "حالة حضور الضيفة": guest.is_used ? "حضرت" : "لم تحضر",
      "وقت دخول الضيفة": guest.used_at
        ? new Date(guest.used_at).toLocaleString("ar-SA")
        : "",
      "المرافقات الحاضرات": stats.attended,
      "المرافقات المتبقيات": stats.total - stats.attended
    };
  });

  const totalGuests = loviraAttendanceRows.length;
  const attendedGuests = loviraAttendanceRows.filter(
    r => r["حالة حضور الضيفة"] === "حضرت"
  ).length;

  const totalCompanions = loviraAttendanceRows.reduce(
    (sum, r) => sum + r["عدد المرافقات"], 0
  );

  const attendedCompanions = loviraAttendanceRows.reduce(
    (sum, r) => sum + r["المرافقات الحاضرات"], 0
  );

  const statistics = [
    ["إجمالي الضيفات", totalGuests],
    ["الضيفات الحاضرات", attendedGuests],
    ["الضيفات الغائبات", totalGuests - attendedGuests],
    ["إجمالي المرافقات", totalCompanions],
    ["المرافقات الحاضرات", attendedCompanions],
    ["المرافقات المتبقيات", totalCompanions - attendedCompanions],
    ["إجمالي الدخول", attendedGuests + attendedCompanions]
  ];

  const statsBox = document.createElement("div");
  statsBox.style.cssText =
    "display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;";

  for (const [label, value] of statistics) {
    const card = document.createElement("div");
    card.style.cssText =
      "padding:12px;background:#f7f0f5;border-radius:10px;text-align:center;";

    const title = document.createElement("div");
    title.textContent = label;

    const number = document.createElement("strong");
    number.textContent = value;
    number.style.cssText = "display:block;font-size:23px;margin-top:6px;";

    card.append(title, number);
    statsBox.appendChild(card);
  }

  summary.appendChild(statsBox);

  const headers = [
    "اسم الضيفة",
    "عدد المرافقات",
    "حالة حضور الضيفة",
    "وقت دخول الضيفة",
    "المرافقات الحاضرات",
    "المرافقات المتبقيات"
  ];

  const htmlTable = document.createElement("table");
  htmlTable.style.cssText =
    "width:100%;border-collapse:collapse;min-width:650px;margin-top:15px;";

  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  for (const header of headers) {
    const th = document.createElement("th");
    th.textContent = header;
    th.style.cssText =
      "padding:10px;border:1px solid #e5d5e0;background:#f7f0f5;";
    headerRow.appendChild(th);
  }

  thead.appendChild(headerRow);
  htmlTable.appendChild(thead);

  const tbody = document.createElement("tbody");

  for (const row of loviraAttendanceRows) {
    const tr = document.createElement("tr");

    for (const header of headers) {
      const td = document.createElement("td");
      td.textContent = row[header];
      td.style.cssText =
        "padding:10px;border:1px solid #e5d5e0;text-align:center;";
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }

  htmlTable.appendChild(tbody);
  table.appendChild(htmlTable);

  msg.textContent = "تم تحميل التقرير بنجاح 💜";
}

document.getElementById("loadAttendanceBtn").onclick =
  loadAttendanceReport;

document.getElementById("downloadAttendanceBtn").onclick =
function () {
  if (!loviraAttendanceRows.length) {
    alert("اعرضي تقرير الحضور أولًا.");
    return;
  }

  const headers = Object.keys(loviraAttendanceRows[0]);

  const escapeCsv = value => {
    const text = String(value ?? "");
    return '"' + text.replace(/"/g, '""') + '"';
  };

  const csv = [
    headers.map(escapeCsv).join(","),
    ...loviraAttendanceRows.map(row =>
      headers.map(header => escapeCsv(row[header])).join(",")
    )
  ].join("\r\n");

  const blob = new Blob(
    ["\uFEFF" + csv],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "LOVIRA-تقرير-الحضور.csv";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

document.getElementById("loadInvitationLinksBtn").onclick =
async function () {
  const eventId = document.getElementById("loviraEventSelect").value;
  const list = document.getElementById("invitationLinksList");
  const message = document.getElementById("invitationLinksMessage");

  list.replaceChildren();

  if (!eventId) {
    message.textContent = "اختاري المناسبة أولًا.";
    return;
  }

  message.textContent = "جارٍ تحميل روابط الدعوات...";

  const { data: guests, error } = await db
    .from("lovira_guests")
    .select("guest_name,companions,qr_token")
    .eq("event_id", eventId)
    .order("guest_name");

  if (error) {
    message.textContent = "تعذر تحميل الروابط: " + error.message;
    return;
  }

  if (!guests || !guests.length) {
    message.textContent = "لا توجد ضيفات لهذه المناسبة.";
    return;
  }

  for (const guest of guests) {
    const url = new URL("invitation.html", location.href);
    url.searchParams.set("guest", guest.qr_token);

    const card = document.createElement("div");
    card.style.cssText =
      "padding:15px;margin:10px 0;border:1px solid #e5d5e0;border-radius:12px;";

    const name = document.createElement("strong");
    name.textContent = guest.guest_name;

    const info = document.createElement("p");
    info.textContent = "عدد المرافقات: " + guest.companions;

    const whatsapp = document.createElement("button");
    whatsapp.type = "button";
    whatsapp.textContent = "💚 إرسال عبر واتساب";
    whatsapp.style.background = "#258b61";

    
whatsapp.onclick = function () {
  const text =
    "💌 دعوة خاصة\n" +
    "تفضلي رابط دعوتك:\n" +
    url.href;

  const whatsappUrl =
    "https://wa.me/?text=" + encodeURIComponent(text);

  window.location.href = whatsappUrl;
};


    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "📋 نسخ رابط الدعوة";

    copy.onclick = async function () {
      try {
        await navigator.clipboard.writeText(url.href);
        copy.textContent = "تم نسخ الرابط ✓";
      } catch {
        window.prompt("انسخي الرابط:", url.href);
      }
    };

    card.append(name, info, whatsapp, copy);
    list.appendChild(card);
  }

  message.textContent =
    "تم تجهيز روابط " + guests.length + " ضيفة 💜";
};

</script>
</body>
</html>
