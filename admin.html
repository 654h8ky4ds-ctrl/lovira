
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOVIRA | لوحة الإدارة</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f7f0f5;
  color: #56334f;
}
header {
  background: #56334f;
  color: white;
  padding: 25px;
  text-align: center;
}
header h1 { margin: 0 0 8px; }
main { max-width: 850px; margin: 25px auto; padding: 15px; }
.card {
  background: white;
  padding: 22px;
  margin-bottom: 20px;
  border-radius: 16px;
  box-shadow: 0 5px 20px #56334f12;
}
input, button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 9px;
  font-size: 15px;
}
input { border: 1px solid #d9c7d4; }
button {
  background: #754568;
  color: white;
  border: none;
  cursor: pointer;
}
button:disabled { opacity: .5; }
#dashboard { display: none; }
small { color: #806b7c; }
</style>
</head>
<body>

<header>
  <h1>LOVIRA ♛</h1>
  <div>لوحة إدارة الدعوات الخاصة</div>
</header>

<main>
  <section class="card" id="login">
    <h2>تسجيل دخول الإدارة</h2>
    <input id="email" type="email"
      placeholder="البريد الإلكتروني">
    <input id="password" type="password"
      placeholder="كلمة المرور">
    <button id="loginBtn">تسجيل الدخول</button>
    <p id="loginMessage"></p>
  </section>

  <section id="dashboard">
    <div class="card">
      <h2>مرحبًا بك في LOVIRA 💜</h2>
      <p>إدارة المناسبات والضيفات والدعوات.</p>
      <button id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="card">
      <h2>💌 إدارة الضيفات</h2>

<form id="loviraGuestForm">
  
<label for="loviraEventSelect">اختاري المناسبة:</label>
<select id="loviraEventSelect" required
  style="width:100%;padding:13px;margin:8px 0;border:1px solid #d9c7d4;border-radius:9px;background:white;">
  <option value="">جارٍ تحميل المناسبات...</option>
</select>

  <input id="newGuestName" type="text"
    placeholder="اسم الضيفة" required>

  <input id="newGuestCompanions" type="number"
    placeholder="عدد المرافقات"
    min="0" value="0" required>

  <button type="submit">💌 إضافة ضيفة</button>
</form>
<p id="guestMessage"></p>

    </div>

    <div class="card">
      <h2>📱 روابط الدعوات</h2>
      <p>سنضيف هنا إنشاء الروابط وإرسال واتساب.</p>
    </div>

    <div class="card">
      <h2>📊 متابعة الحضور</h2>
      <p>سنضيف هنا حالات الدخول والباركودات.</p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient(
  "https://ddfdkarrcijcubzoqxce.supabase.co",
  "sb_publishable_G4b-jueJb1pAE2Kawm-R1Q_Hn7KEfAx"
);

const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("loginMessage");

async function showSession() {
  const { data } = await db.auth.getUser();
  const user = data.user;

  // لا تُعرض لوحة الإدارة إلا بعد التحقق
  // من الصلاحيات في الخطوة التالية.
  login.style.display = "block";
  dashboard.style.display = "none";

  
if (user) {
  const { data: admin, error } = await db
    .from("lovira_admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (!error && admin) {
    login.style.display = "none";
    dashboard.style.display = "block";
    message.textContent = "";
  } else {
    message.textContent =
      "هذا الحساب غير مصرح له بدخول لوحة الإدارة.";
  }
}

}

document.getElementById("loginBtn").onclick =
async function () {
  message.textContent = "جارٍ التحقق...";
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({
    email, password
  });

  if (error) {
    message.textContent = "تعذر تسجيل الدخول: " + error.message;
    return;
  }

  await showSession();
};

document.getElementById("logoutBtn").onclick =
async function () {
  await db.auth.signOut();
  await showSession();
};

showSession();
  
document.getElementById("loviraGuestForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("guestMessage");
    const guestName = document.getElementById("newGuestName").value.trim();
    const companions = Number(
      document.getElementById("newGuestCompanions").value
    );

    if (!guestName || !Number.isInteger(companions) || companions < 0) {
      message.textContent = "تأكدي من اسم الضيفة وعدد المرافقات.";
      return;
    }

    message.textContent = "جارٍ إضافة الضيفة...";

    const { data: events, error: eventError } = await db
      .from("lovira_events")
      .select("id")
      .limit(2);

    if (eventError || !events || events.length !== 1) {
      message.textContent =
        "لازم نحدد المناسبة أولًا قبل إضافة الضيفة.";
      return;
    }

    const { error } = await db
      .from("lovira_guests")
      .insert({
        event_id: events[0].id,
        guest_name: guestName,
        companions: companions
      });

    if (error) {
      message.textContent = "تعذرت الإضافة: " + error.message;
      return;
    }

    message.textContent = "تمت إضافة الضيفة بنجاح 💜";
    document.getElementById("loviraGuestForm").reset();
  });

async function loadLoviraEvents() {
  const select = document.getElementById("loviraEventSelect");

  const { data, error } = await db
    .from("lovira_events")
    .select("id,event_name");

  select.innerHTML = "";

  if (error) {
    select.add(new Option("تعذر تحميل المناسبات", ""));
    console.error(error);
    return;
  }

  select.add(new Option("اختاري المناسبة", ""));

  for (const event of data) {
    select.add(new Option(event.event_name, event.id));
  }
}

loadLoviraEvents();

</script>
</body>
</html>
